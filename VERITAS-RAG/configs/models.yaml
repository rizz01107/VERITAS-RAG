# Model registry. Config files refer to these keys (embedding.model_ref, ...).
# Secrets never live here (API keys come from VERITAS_GENERATOR_API_KEY).
# Put machine-specific choices (generator model_id/base_url) in the git-ignored
# configs/models.local.yaml; it is deep-merged over this file.
#
# STATUS: the three local models below are CANDIDATES. Their `revision` must be pinned
# to a full 40-hex commit hash after the model is downloaded and tested (Phases 4-6, 9).
# They were not downloaded or verified during Phase 2 (no model-hub access in the
# build environment). Full-evaluation readiness checks refuse unpinned models.
models:
  embedder_default:
    role: embedder
    provider: huggingface_local
    model_id: BAAI/bge-small-en-v1.5
    revision: null
    notes: "candidate; small enough for CPU; pin revision before full evaluation"
  reranker_default:
    role: reranker
    provider: huggingface_local
    model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
    revision: null
    notes: "candidate cross-encoder; pin revision before full evaluation"
  nli_default:
    role: nli
    provider: huggingface_local
    model_id: cross-encoder/nli-deberta-v3-base
    revision: null
    notes: "candidate verifier; must differ from the generator; pin revision"
  generator_default:
    role: generator
    provider: openai_compatible
    model_id: null      # choose in models.local.yaml; use a dated snapshot id if offered
    base_url: null      # any OpenAI-compatible endpoint; set in models.local.yaml
    notes: "provider-agnostic; model_id/base_url intentionally unset"
